name: WSA-2026-055 External Effect Recovery

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  external-effect-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test test/connections-external-effect-recovery.integration.test.js
