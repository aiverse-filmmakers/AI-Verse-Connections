name: WSA-2026-059 Receipt Index Scale

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  receipt-index-scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node benchmarks/receipt-index-scale.mjs
